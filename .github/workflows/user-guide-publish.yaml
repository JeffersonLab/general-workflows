name: User Guide Publish

# Publishes the caller's user guide website, built with Zensical (https://zensical.org), to
# GitHub Pages from the gh-pages branch: this release's in its own folder (v1.2.3/), the same in
# latest/, and a front page listing the releases. The caller keeps zensical.toml (which builds
# into site/, Zensical's default), pyproject.toml and uv.lock at its root, and gives the calling
# job `contents: write`. user-guide-build.yaml builds the same website for CI.
on:
  workflow_call:
    inputs:
      semvertag:
        description: "The release's tag, such as v1.2.3: the name of its folder on the website"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # One at a time per repository, in order: each run adds to the gh-pages branch
    concurrency:
      group: user-guide-pages
      cancel-in-progress: false
    env:
      SEMVERTAG: ${{ inputs.semvertag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Build the user guide
        run: uv run --locked zensical build --strict
      # Replaces latest/ as a whole, so a page removed in this release goes from it too
      - name: Publish it as the latest
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          target-folder: latest
          commit-message: Publish the ${{ env.SEMVERTAG }} user guide as the latest
      # Adds this release's folder and the front page, and keeps the other releases' folders.
      # Before the first release there is no gh-pages branch to list; the step above creates it.
      # The front page's script is here, not in a file, so that it comes with the workflow at the
      # version the caller pinned. It needs Python 3.11 for tomllib, whatever the caller's
      # project uses, so uv finds or installs one (--no-project).
      - name: Stage this release's folder and the front page
        id: stage
        run: |
          mkdir pages
          cp -r site "pages/$SEMVERTAG"
          git fetch --depth=1 origin gh-pages
          mapfile -t published < <(git ls-tree -d --name-only FETCH_HEAD)
          uv run --no-project --python '>=3.11' python - pages "$SEMVERTAG" "${published[@]}" <<'PY'
          """Write the user guide website's front page: links to the latest release's guide and to
          each release's, newest first.

          Arguments: <output dir> <version folder>...
          The version folders are the gh-pages branch's, such as v5.2.0; other names are ignored.
          The page's title is the site_name in zensical.toml, read from the current directory.
          """
          import html
          import re
          import sys
          import tomllib
          from pathlib import Path


          def main():
              out = Path(sys.argv[1])
              with open("zensical.toml", "rb") as f:
                  title = html.escape(tomllib.load(f)["project"]["site_name"])
              versions = sorted(
                  {v for v in sys.argv[2:] if re.fullmatch(r"v\d+\.\d+\.\d+", v)},
                  key=lambda v: tuple(int(n) for n in v[1:].split(".")),
                  reverse=True,
              )
              items = "\n".join(
                  f'      <li><a href="{html.escape(v)}/">{html.escape(v)}</a></li>' for v in versions
              )
              out.mkdir(parents=True, exist_ok=True)
              (out / "index.html").write_text(f"""<!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>{title}</title>
              <style>
                body {{ font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }}
              </style>
            </head>
            <body>
              <h1>{title}</h1>
              <p><a href="latest/">The latest release's guide</a></p>
              <p>Each release's guide; the Help tab shows the version you are using:</p>
              <ul>
          {items}
              </ul>
            </body>
          </html>
          """)
              # GitHub Pages serves the files as they are, without Jekyll
              (out / ".nojekyll").touch()


          if __name__ == "__main__":
              main()
          PY
      - name: Publish this release's guide
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: pages
          clean: false
          commit-message: Publish the ${{ env.SEMVERTAG }} user guide
